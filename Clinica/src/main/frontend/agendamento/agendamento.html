<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendamento de Exames | Clínica SP</title>

<link rel="stylesheet" href="agendamento.css">



  <link rel="stylesheet" href="../exames/exames.css">

  <link rel="stylesheet" href="agendamento.css">
</head>
<body>

  <header class="header">
    <div class="top-row">
      <a class="logo" href="../inicial/inicial.html" aria-label="Clínica SP - página inicial">
        <img src="../imagens/logo.novo.png" alt="Clínica SP" >
      </a>

      <form class="busca" role="search" action="#">
    
        <input type="search" placeholder="Buscar em todo site..." aria-label="Buscar em todo site">
      </form>

      <div class="botoes">
        <a class="entrar" href="../login/login.html">  
          <span>Login</span>
        </a>
        <a class="btn btn-contorno" href="../exames/exames.html">Resultado de Exames</a>
        <a class="btn btn-cheio" href="agendamento.html" aria-current="page">Agendamento de Exames</a>
      </div>
    </div>

    <nav class="nav-bar" aria-label="Menu principal"> </nav>
  </header>

  <section class="titulo-pagina">
    <nav class="breadcrumb" aria-label="Você está em">
      <a href="../inicial/inicial.html">Início</a> / <span>Agendamento de Exames</span>
    </nav>
    <h1>Agendamento de Exames</h1>
  </section>

  <main class="conteudo">
    <form class="card card-agendamento" id="form-agendamento" action="#" method="post">
      <p class="card-descricao">Preencha os dados abaixo para agendar seu exame</p>

      <div class="linha">
        <div class="campo">
          <label for="exame">Exame</label>
          <!-- As opções abaixo são exemplos: troque pelos dados reais (ou carregue do back-end) -->
          <select id="exame" name="exame" required>
            <option value="" disabled selected hidden>Selecione o exame</option>
            <option>Hemograma completo</option>
            <option>Glicemia em jejum</option>
            <option>Colesterol total e frações</option>
            <option>Eletrocardiograma</option>
            <option>Raio-X</option>
            <option>Ultrassonografia</option>
          </select>
        </div>

        <div class="campo">
          <label for="unidade">Unidade</label>
          <select id="unidade" name="unidade" required>
            <option value="" disabled selected hidden>Selecione a unidade</option>
            <option>Unidade Paulista</option>
            <option>Unidade Centro</option>
            <option>Unidade Zona Sul</option>
            <option>Unidade Zona Leste</option>
          </select>
        </div>
      </div>

      <div class="linha">
        <div class="campo">
          <label for="data">Data</label>
          <input type="text" id="data" name="data" placeholder="DD/MM/AAAA"
                 inputmode="numeric" maxlength="10" autocomplete="off" required>
        </div>

        <div class="campo">
          <label for="horario">Horário</label>
          <select id="horario" name="horario" required>
            <option value="" disabled selected hidden>Selecione o horário</option>
            <option>08:00</option>
            <option>09:00</option>
            <option>10:00</option>
            <option>11:00</option>
            <option>14:00</option>
            <option>15:00</option>
            <option>16:00</option>
            <option>17:00</option>
          </select>
        </div>
      </div>

      <div class="campo">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo"
               autocomplete="name" required>
      </div>

      <div class="linha">
        <div class="campo">
          <label for="cpf">CPF</label>
          <input type="text" id="cpf" name="cpf" placeholder="Digite seu CPF"
                 inputmode="numeric" maxlength="14" autocomplete="off" required>
        </div>

        <div class="campo">
          <label for="telefone">Telefone</label>
          <input type="tel" id="telefone" name="telefone" placeholder="(11) 91234-5678"
                 inputmode="numeric" maxlength="15" autocomplete="tel" required>
        </div>
      </div>

      <button type="submit" class="btn-confirmar">Confirmar Agendamento</button>
    </form>
  </main>

  <script>
    const cpf = document.getElementById('cpf');
    cpf.addEventListener('input', () => {
      const d = cpf.value.replace(/\D/g, '').slice(0, 11);
      cpf.value = d
        .replace(/(\d{3})(\d)/, '$1.$2')
        .replace(/(\d{3})(\d)/, '$1.$2')
        .replace(/(\d{3})(\d{1,2})$/, '$1-$2');
    });

    const data = document.getElementById('data');
    data.addEventListener('input', () => {
      const d = data.value.replace(/\D/g, '').slice(0, 8);
      data.value = d
        .replace(/(\d{2})(\d)/, '$1/$2')
        .replace(/(\d{2})\/(\d{2})(\d)/, '$1/$2/$3');
    });

    const telefone = document.getElementById('telefone');
    telefone.addEventListener('input', () => {
      const d = telefone.value.replace(/\D/g, '').slice(0, 11);
      let t = d;
      if (d.length > 10) {
        t = d.replace(/^(\d{2})(\d{5})(\d{0,4})/, '($1) $2-$3');
      } else if (d.length > 6) {
        t = d.replace(/^(\d{2})(\d{4})(\d{0,4})/, '($1) $2-$3');
      } else if (d.length > 2) {
        t = d.replace(/^(\d{2})(\d{0,5})/, '($1) $2');
      } else if (d.length > 0) {
        t = '(' + d;
      }
      telefone.value = t;
    });

  
  </script>

</body>
</html>
