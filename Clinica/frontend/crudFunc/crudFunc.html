<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle</title>
    <link rel="stylesheet" href="crudFunc.css">
</head>
<body>
    <header>
        <img class="logo" src="../imagens/logo.novo.png" alt="Logo">
        <input type="text" placeholder="Busque funcionários..." onkeyup="listarFuncionarios()">

        <a class="login" href="../login/login.html">
            <img src="../imagens/login.svg" alt="Login">
            <span>Login</span>
        </a>
    </header>

    <div class="layout">

        <aside class="barra-lateral">
            <nav class="barra">
                <a href="../crudFunc/crudFunc.html" class="selecionado">
                    <img src="../imagens/funcionários.svg" alt="Funcionários">
                    <span>Funcionários</span>
                </a>
                <a href="../crudProc/crudProc.html">
                    <img src="../imagens/procedimentos.svg" alt="Procedimentos">
                    <span>Procedimentos</span>
                </a>
                <a href="../crudUnid/crudUnid.html">
                    <img src="../imagens/unidades.svg" alt="Unidades">
                    <span>Unidades</span>
                </a>
                <a href="../crudAgend/crudAgend.html">
                    <img src="../imagens/agendamentos.svg" alt="Agendamentos">
                    <span>Agendamentos</span>
                </a>
            </nav>
        </aside>

        <section class="conteudo">

            <h1>Gestão de Funcionários</h1>
            <button class="btn-adicionar" onclick="adicionarFuncionario()">Adicionar Funcionário</button>
            <div class="tabela-funcionarios">

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome Completo</th>
                        <th>Cargo</th>
                        <th>Especialidade</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="tabela-funcionarios">
                </tbody>
            </table>
        </div>
        </section>

    </div>

    <script src = "crudFunc.js"></script>

</body>
</html>
